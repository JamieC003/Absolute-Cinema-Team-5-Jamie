spring.application.name=cinema-booking

# Database Configuration
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:33306/cinema_ebooking_platform
spring.datasource.username=root
spring.datasource.password=mysqlpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080

# CORS (for React frontend)
spring.web.cors.allowed-origins=http://localhost:3000

# Application URL Config
app.base-url=http://localhost:3000

# Email Configuration (Mailpit local dev)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=noreply@absolute-cinema.com

# Ticket pricing defaults for booking flow
booking.ticket-price.adult=14.99
booking.ticket-price.child=10.99
booking.ticket-price.senior=12.99

# Encryption Configuration (AES-256 key)
encryption.enabled=true
encryption.key=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWY=

# Making Java runtime trust Gmail’s SMTP certificate
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
